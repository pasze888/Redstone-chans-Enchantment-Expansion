# Eternal Frost's freeze animation (eternal_frost_animation) drives a block_display
# shatter in Java, so it has to write Display's synced transformation data.
# These four setters are private in 1.21.1 and NeoForge exposes no public API for
# them, so widen them here. ASCII only on purpose: this file is parsed by FML's
# access transformer before any charset handling is guaranteed.
# Verified against compiledWithNeoForge_50f69430...jar (the 21.1.219 compile
# classpath this repo actually uses); see docs/reference/enchantment-runtime-effects.md
public net.minecraft.world.entity.Display setTransformation(Lcom/mojang/math/Transformation;)V
public net.minecraft.world.entity.Display setTransformationInterpolationDuration(I)V
public net.minecraft.world.entity.Display setTransformationInterpolationDelay(I)V
public net.minecraft.world.entity.Display$BlockDisplay setBlockState(Lnet/minecraft/world/level/block/state/BlockState;)V
